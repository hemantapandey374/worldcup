<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Tournament Bracket Predictor</title>

    <!-- ─── Google Fonts ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
                   GLOBAL RESET & BASE
                   ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #0b1a30;
            --primary-light: #112240;
            --accent: #f5c518;
            --accent-dark: #d4a800;
            --gold: #ffd700;
            --win-glow: rgba(245, 197, 24, 0.35);
            --card-bg: #ffffff;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --card-radius: 14px;
            --team-hover: #f0f4ff;
            --text-primary: #0b1a30;
            --text-secondary: #4a5568;
            --text-light: #a0aec0;
            --border-light: #e2e8f0;
            --success: #38a169;
            --danger: #e53e3e;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: #f1f5f9;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================================
                   APP CONTAINER
                   ============================================================ */
        #app {
            width: 100%;
            max-width: 1440px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
            min-height: 90vh;
            transition: var(--transition);
        }

        /* ============================================================
                   SCREENS (login / name / bracket)
                   ============================================================ */
        .screen {
            display: none;
            animation: fadeSlideIn 0.45s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
                   LOGIN SCREEN
                   ============================================================ */
        .login-screen {
            padding: 60px 40px;
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        .login-screen .logo {
            font-size: 4rem;
            margin-bottom: 8px;
        }

        .login-screen h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-screen .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 36px;
            font-weight: 400;
        }

        .login-form {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-form label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .login-form .input-group {
            position: relative;
        }

        .login-form .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: var(--text-light);
            pointer-events: none;
        }

        .login-form input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            font-family: var(--font);
            transition: var(--transition);
            background: #fff;
            color: var(--text-primary);
        }

        .login-form input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245, 197, 24, 0.15);
            outline: none;
        }

        .login-form input[type="text"]::placeholder {
            color: var(--text-light);
            font-weight: 400;
            font-size: 0.95rem;
        }

        .login-form .hint {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: -8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: #0f2a4a;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(11, 26, 48, 0.25);
        }

        .btn-accent {
            background: var(--accent);
            color: var(--primary);
        }
        .btn-accent:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(245, 197, 24, 0.35);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--border-light);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            background: rgba(245, 197, 24, 0.06);
        }

        .btn-sm {
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 10px;
        }

        .btn-danger-outline {
            background: transparent;
            color: var(--danger);
            border: 2px solid rgba(229, 62, 62, 0.25);
        }
        .btn-danger-outline:hover {
            background: rgba(229, 62, 62, 0.06);
            border-color: var(--danger);
        }

        .login-error {
            color: var(--danger);
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 24px;
            text-align: center;
        }

        /* ============================================================
                   NAME COLLECTION SCREEN
                   ============================================================ */
        .name-screen {
            padding: 60px 40px;
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        .name-screen .user-badge {
            background: var(--primary);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        .name-screen h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .name-screen .sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .name-form {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .name-form input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            font-family: var(--font);
            transition: var(--transition);
            background: #fff;
        }

        .name-form input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245, 197, 24, 0.15);
            outline: none;
        }

        /* ============================================================
                   STUDENT INFO BAR
                   ============================================================ */
        .student-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: var(--primary);
            color: #fff;
            flex-wrap: wrap;
            gap: 12px;
            border-radius: 0 0 20px 20px;
        }

        .student-bar .info {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .student-bar .info .name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .student-bar .info .detail {
            font-size: 0.9rem;
            opacity: 0.8;
            display: flex;
            gap: 16px;
        }

        .student-bar .info .detail span {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .student-bar .actions {
            display: flex;
            gap: 10px;
        }

        /* ============================================================
                   BRACKET LAYOUT
                   ============================================================ */
        .bracket-wrapper {
            padding: 32px 24px 40px;
            overflow-x: auto;
        }

        .bracket-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            min-width: 820px;
            padding-bottom: 12px;
        }

        /* ─── Side (Left / Right) ─── */
        .bracket-side {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bracket-side .side-label {
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 8px 0 4px;
            border-bottom: 2px solid var(--border-light);
        }

        .round-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .round-label {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-light);
            padding: 4px 8px 2px;
            border-left: 4px solid var(--accent);
            margin-bottom: 2px;
        }

        /* ─── Matches ─── */
        .match-card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            padding: 12px 16px;
            border: 2px solid transparent;
            transition: var(--transition);
            position: relative;
            cursor: default;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .match-card.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .match-card .match-vs {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 1px;
            padding: 2px 0;
        }

        .team-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 10px;
            background: #f8fafc;
            border: 2px solid transparent;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .team-option:hover:not(.disabled) {
            background: var(--team-hover);
            border-color: #cbd5e0;
            transform: translateX(4px);
        }

        .team-option .seed {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-light);
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 6px;
            min-width: 28px;
            text-align: center;
        }

        .team-option .team-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            flex: 1;
        }

        .team-option .check {
            font-size: 1.1rem;
            opacity: 0;
            transition: var(--transition);
            color: var(--accent);
        }

        /* Selected state */
        .team-option.selected {
            background: rgba(245, 197, 24, 0.12);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--win-glow), 0 4px 12px rgba(245, 197, 24, 0.15);
            transform: translateX(6px);
        }

        .team-option.selected .check {
            opacity: 1;
            transform: scale(1.1);
        }

        .team-option.selected .seed {
            background: var(--accent);
            color: var(--primary);
        }

        /* Winner highlight */
        .team-option.winner {
            background: linear-gradient(135deg, rgba(245, 197, 24, 0.18), rgba(245, 197, 24, 0.06));
            border-color: var(--gold);
        }

        .team-option.winner .check {
            opacity: 1;
            color: var(--gold);
        }

        /* Eliminated */
        .team-option.eliminated {
            opacity: 0.35;
            filter: grayscale(0.7);
            pointer-events: none;
        }

        .team-option.eliminated .check {
            opacity: 0;
        }

        /* ─── Finals / Champion ─── */
        .finals-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 220px;
            padding: 20px 12px;
            background: linear-gradient(180deg, rgba(245, 197, 24, 0.05) 0%, transparent 100%);
            border-radius: 20px;
            border: 2px dashed var(--border-light);
        }

        .finals-center .finals-label {
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
        }

        .finals-center .final-match {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .finals-center .final-match .team-option {
            background: #f8fafc;
        }

        .finals-center .champion-box {
            margin-top: 8px;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            border-radius: 16px;
            text-align: center;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--primary);
            box-shadow: 0 8px 30px rgba(245, 197, 24, 0.3);
            min-width: 180px;
            transition: var(--transition);
        }

        .finals-center .champion-box.empty {
            background: #e2e8f0;
            color: var(--text-light);
            box-shadow: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* ─── Connector lines (subtle) ─── */
        .bracket-side .round-group+.round-group {
            position: relative;
        }

        .bracket-side .round-group+.round-group::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            width: 40%;
            height: 2px;
            background: var(--border-light);
            transform: translateX(-50%);
        }

        /* ============================================================
                   SAVE STATUS
                   ============================================================ */
        .save-status {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
        }

        .save-status.saved {
            color: #68d391;
        }
        .save-status.saving {
            color: var(--accent);
        }
        .save-status.error {
            color: var(--danger);
        }

        /* ============================================================
                   TOAST / NOTIFICATION
                   ============================================================ */
        .toast-container {
            position: fixed;
            top: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }

        .toast {
            padding: 14px 22px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            font-weight: 500;
            font-size: 0.95rem;
            animation: toastIn 0.35s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 5px solid var(--accent);
        }

        .toast.toast-success {
            border-left-color: var(--success);
        }
        .toast.toast-error {
            border-left-color: var(--danger);
        }

        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateX(40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 1024px) {
            #app {
                border-radius: 20px;
                min-height: 95vh;
            }
            .bracket-container {
                flex-direction: column;
                align-items: center;
                min-width: 0;
            }
            .bracket-side {
                width: 100%;
                min-width: 0;
            }
            .finals-center {
                width: 100%;
                min-width: 0;
                order: -1;
                border: none;
                border-radius: 16px;
                padding: 16px;
                background: rgba(245, 197, 24, 0.04);
            }
            .student-bar {
                padding: 12px 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            .student-bar .info {
                width: 100%;
                justify-content: space-between;
            }
            .student-bar .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .login-screen,
            .name-screen {
                padding: 40px 24px;
            }
            .login-screen h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            #app {
                border-radius: 12px;
                min-height: 98vh;
            }
            .login-screen h1 {
                font-size: 1.4rem;
            }
            .login-screen .logo {
                font-size: 2.8rem;
            }
            .login-form input[type="text"] {
                padding: 14px 14px 14px 42px;
                font-size: 1rem;
            }
            .btn {
                padding: 14px 24px;
                font-size: 0.95rem;
            }
            .student-bar .info .detail {
                font-size: 0.75rem;
                gap: 8px;
                flex-wrap: wrap;
            }
            .student-bar .info .detail span {
                padding: 2px 10px;
            }
            .bracket-wrapper {
                padding: 16px 8px 24px;
            }
            .match-card {
                padding: 8px 12px;
            }
            .team-option {
                padding: 6px 10px;
                gap: 6px;
            }
            .team-option .team-name {
                font-size: 0.85rem;
            }
            .finals-center .champion-box {
                font-size: 1rem;
                padding: 12px 16px;
                min-width: 120px;
            }
            .toast-container {
                top: 12px;
                right: 12px;
                left: 12px;
                max-width: none;
            }
        }

        /* ============================================================
                   MISC UTILITY
                   ============================================================ */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .gap-8 {
            gap: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* login pulse hint */
        .pulse-hint {
            animation: pulseText 2s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* scrollbar styling */
        .bracket-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .bracket-wrapper::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 4px;
        }
        .bracket-wrapper::-webkit-scrollbar-thumb {
            background: #a0aec0;
            border-radius: 4px;
        }
        .bracket-wrapper::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
    </style>
</head>

<body>
    <!-- ─── TOAST CONTAINER ─── -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ─── APP ─── -->
    <div id="app">

        <!-- ============================================================
        SCREEN 1: LOGIN
        ============================================================ -->
        <div id="loginScreen" class="screen active login-screen">
            <div class="logo">🏆</div>
            <h1>Bracket Predictor</h1>
            <p class="subtitle">Tournament Edition • 32 Teams</p>

            <form id="loginForm" class="login-form" autocomplete="off">
                <label for="studentCode">Student Code</label>
                <div class="input-group">
                    <span class="icon">🎓</span>
                    <input
                    type="text"
                    id="studentCode"
                    placeholder="e.g. 7C25"
                    required
                    maxlength="10"
                    autofocus
                    />
                </div>
                <p class="hint">Format: Class + Section + Roll Number &nbsp;·&nbsp; e.g. <strong>5A01</strong>, <strong>10B18</strong></p>
                <div id="loginError" class="login-error"></div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span>Sign In</span>
                </button>
            </form>
            <p style="margin-top:28px; font-size:0.85rem; color:var(--text-light);">
                🧪 Demo: use any code from <strong>5A01</strong> – <strong>10E30</strong>
            </p>
        </div>

        <!-- ============================================================
        SCREEN 2: NAME COLLECTION
        ============================================================ -->
        <div id="nameScreen" class="screen name-screen">
            <div class="user-badge" id="nameBadge">✅ Verified</div>
            <h2>Welcome!</h2>
            <p class="sub" id="nameSub">Please tell us your name to continue.</p>

            <form id="nameForm" class="name-form" autocomplete="off">
                <input
                type="text"
                id="studentName"
                placeholder="Your full name"
                required
                maxlength="60"
                />
                <button type="submit" class="btn btn-accent" id="nameBtn">
                    <span>Continue to Bracket →</span>
                </button>
                <button type="button" class="btn btn-outline btn-sm" id="backToLoginBtn">
                    ← Back
                </button>
            </form>
        </div>

        <!-- ============================================================
        SCREEN 3: BRACKET
        ============================================================ -->
        <div id="bracketScreen" class="screen">

            <!-- ─── Student Bar ─── -->
            <div class="student-bar">
                <div class="info">
                    <span class="name" id="displayName">—</span>
                    <div class="detail">
                        <span id="displayClass">—</span>
                        <span id="displaySection">—</span>
                        <span id="displayRoll">—</span>
                        <span id="displayCode" style="opacity:0.5;">—</span>
                    </div>
                </div>
                <div class="actions">
                    <span id="saveStatus" class="save-status">💾 Saved</span>
                    <button class="btn btn-sm btn-danger-outline" id="logoutBtn">🚪 Logout</button>
                </div>
            </div>

            <!-- ─── Bracket ─── -->
            <div class="bracket-wrapper">
                <div id="bracketContainer" class="bracket-container">
                    <!-- Dynamically rendered -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        //  CONFIGURATION
        // ================================================================

        // ★ Set your Google Apps Script Web App URL here ★
        const API_BASE = ''; // e.g. 'https://script.google.com/macros/s/XXXX/exec'

        // Demo mode — when API_BASE is empty, use local in-memory storage
        const DEMO_MODE = !API_BASE;

        // ================================================================
        //  SEEDED TEAMS (placeholder — easy to replace)
        // ================================================================

        const TEAM_DATA = [
            // ── Left Bracket: seeds 1–16 ──
            { id: 'L01', name: 'Eagles', seed: 1, region: 'left' },
            { id: 'L02', name: 'Titans', seed: 16, region: 'left' },
            { id: 'L03', name: 'Vikings', seed: 8, region: 'left' },
            { id: 'L04', name: 'Falcons', seed: 9, region: 'left' },
            { id: 'L05', name: 'Mustangs', seed: 5, region: 'left' },
            { id: 'L06', name: 'Huskies', seed: 12, region: 'left' },
            { id: 'L07', name: 'Panthers', seed: 4, region: 'left' },
            { id: 'L08', name: 'Cobras', seed: 13, region: 'left' },
            { id: 'L09', name: 'Hawks', seed: 6, region: 'left' },
            { id: 'L10', name: 'Wolves', seed: 11, region: 'left' },
            { id: 'L11', name: 'Lions', seed: 3, region: 'left' },
            { id: 'L12', name: 'Bears', seed: 14, region: 'left' },
            { id: 'L13', name: 'Sharks', seed: 7, region: 'left' },
            { id: 'L14', name: 'Storm', seed: 10, region: 'left' },
            { id: 'L15', name: 'Dragons', seed: 2, region: 'left' },
            { id: 'L16', name: 'Phoenix', seed: 15, region: 'left' },
            // ── Right Bracket: seeds 17–32 ──
            { id: 'R01', name: 'Thunder', seed: 1, region: 'right' },
            { id: 'R02', name: 'Blaze', seed: 16, region: 'right' },
            { id: 'R03', name: 'Storm', seed: 8, region: 'right' },
            { id: 'R04', name: 'Knights', seed: 9, region: 'right' },
            { id: 'R05', name: 'Ravens', seed: 5, region: 'right' },
            { id: 'R06', name: 'Hornets', seed: 12, region: 'right' },
            { id: 'R07', name: 'Bulldogs', seed: 4, region: 'right' },
            { id: 'R08', name: 'Stallions', seed: 13, region: 'right' },
            { id: 'R09', name: 'Pumas', seed: 6, region: 'right' },
            { id: 'R10', name: 'Gladiators', seed: 11, region: 'right' },
            { id: 'R11', name: 'Warriors', seed: 3, region: 'right' },
            { id: 'R12', name: 'Spartans', seed: 14, region: 'right' },
            { id: 'R13', name: 'Jets', seed: 7, region: 'right' },
            { id: 'R14', name: 'Rockets', seed: 10, region: 'right' },
            { id: 'R15', name: 'Chargers', seed: 2, region: 'right' },
            { id: 'R16', name: 'Comets', seed: 15, region: 'right' },
        ];

        const TEAM_MAP = Object.fromEntries(TEAM_DATA.map(t => [t.id, t]));

        // ─── Match pairing per region (1-indexed positions) ───
        const SEED_PAIRS = [
            [1, 16],
            [8, 9],
            [5, 12],
            [4, 13],
            [6, 11],
            [3, 14],
            [7, 10],
            [2, 15]
        ];

        // ================================================================
        //  STATE
        // ================================================================

        let state = {
            student: null, // { code, name, class, section, roll }
            predictions: {
                round32: {}, // { matchId: winnerTeamId }
                round16: {},
                quarter: {},
                semi: {},
                final: {},
                champion: null,
            },
            // Derived winners per round (computed)
            winners: {
                round32: [], // ordered array of winner ids
                round16: [],
                quarter: [],
                semi: [],
                final: null,
                champion: null,
            },
            currentRoundIdx: 0, // 0=round32, 1=round16, 2=quarter, 3=semi, 4=final
            locked: false,
            dirty: false,
        };

        // ================================================================
        //  HELPER: BUILD MATCHES FROM SEEDS
        // ================================================================

        function buildRound32() {
            const leftTeams = TEAM_DATA.filter(t => t.region === 'left').sort((a, b) => a.seed - b.seed);
            const rightTeams = TEAM_DATA.filter(t => t.region === 'right').sort((a, b) => a.seed - b.seed);

            const leftMatches = SEED_PAIRS.map(([s1, s2], i) => {
                const t1 = leftTeams.find(t => t.seed === s1);
                const t2 = leftTeams.find(t => t.seed === s2);
                return {
                    id: `L32_${i+1}`,
                    region: 'left',
                    team1Id: t1.id,
                    team2Id: t2.id,
                    winnerId: null,
                };
            });

            const rightMatches = SEED_PAIRS.map(([s1, s2], i) => {
                const t1 = rightTeams.find(t => t.seed === s1);
                const t2 = rightTeams.find(t => t.seed === s2);
                return {
                    id: `R32_${i+1}`,
                    region: 'right',
                    team1Id: t1.id,
                    team2Id: t2.id,
                    winnerId: null,
                };
            });

            return [...leftMatches, ...rightMatches];
        }

        function buildEmptyRound(count) {
            return Array.from({ length: count }, (_, i) => ({
                id: `match_${i+1}`,
                team1Id: null,
                team2Id: null,
                winnerId: null,
            }));
        }

        // ================================================================
        //  COMPUTE WINNERS FROM PREDICTIONS
        // ================================================================

        function computeWinners(state) {
            const w = { round32: [], round16: [], quarter: [], semi: [], final: null, champion: null };

            // Round 32
            const r32 = buildRound32();
            r32.forEach(m => {
                const pred = state.predictions.round32[m.id];
                if (pred) m.winnerId = pred;
                w.round32.push(m.winnerId || null);
            });

            // Round 16: pair up round32 winners
            const r16matches = [];
            for (let i = 0; i < 8; i++) {
                const t1 = w.round32[i * 2];
                const t2 = w.round32[i * 2 + 1];
                const mid = `R16_${i+1}`;
                const pred = state.predictions.round16[mid];
                r16matches.push({
                    id: mid,
                    team1Id: t1,
                    team2Id: t2,
                    winnerId: pred || null,
                });
                w.round16.push(r16matches[i].winnerId || null);
            }

            // Quarterfinals: pair up round16 winners
            const qmatches = [];
            for (let i = 0; i < 4; i++) {
                const t1 = w.round16[i * 2];
                const t2 = w.round16[i * 2 + 1];
                const mid = `Q_${i+1}`;
                const pred = state.predictions.quarter[mid];
                qmatches.push({
                    id: mid,
                    team1Id: t1,
                    team2Id: t2,
                    winnerId: pred || null,
                });
                w.quarter.push(qmatches[i].winnerId || null);
            }

            // Semifinals: pair up quarter winners
            const smatches = [];
            for (let i = 0; i < 2; i++) {
                const t1 = w.quarter[i * 2];
                const t2 = w.quarter[i * 2 + 1];
                const mid = `S_${i+1}`;
                const pred = state.predictions.semi[mid];
                smatches.push({
                    id: mid,
                    team1Id: t1,
                    team2Id: t2,
                    winnerId: pred || null,
                });
                w.semi.push(smatches[i].winnerId || null);
            }

            // Final
            const finalMatch = {
                id: 'FINAL',
                team1Id: w.semi[0] || null,
                team2Id: w.semi[1] || null,
                winnerId: state.predictions.final?.winner || null,
            };
            w.final = finalMatch.winnerId || null;

            // Champion
            w.champion = state.predictions.champion || null;

            return { r32matches: r32, r16matches, qmatches, smatches, finalMatch, winners: w };
        }

        // ================================================================
        //  RENDER BRACKET
        // ================================================================

        function renderBracket() {
            const container = document.getElementById('bracketContainer');
            const data = computeWinners(state);
            const w = data.winners;

            // Determine which rounds are interactive
            const roundActive = {
                round32: state.currentRoundIdx === 0,
                round16: state.currentRoundIdx === 1,
                quarter: state.currentRoundIdx === 2,
                semi: state.currentRoundIdx === 3,
                final: state.currentRoundIdx === 4,
            };

            // Build HTML
            let html = '';

            // ─── LEFT SIDE ───
            html += `<div class="bracket-side"><div class="side-label">⬅ Left Bracket</div>`;

            // Round of 32 (left half)
            const leftR32 = data.r32matches.filter(m => m.region === 'left');
            html += renderRound('Round of 32', leftR32, 'round32', roundActive.round32, w.round32.slice(0, 8));

            // Round of 16 (left half)
            const leftR16 = data.r16matches.slice(0, 4);
            html += renderRound('Round of 16', leftR16, 'round16', roundActive.round16, w.round16.slice(0, 4));

            // Quarterfinals (left half)
            const leftQ = data.qmatches.slice(0, 2);
            html += renderRound('Quarterfinals', leftQ, 'quarter', roundActive.quarter, w.quarter.slice(0, 2));

            // Semifinal (left)
            const leftS = data.smatches.slice(0, 1);
            html += renderRound('Semifinal', leftS, 'semi', roundActive.semi, w.semi.slice(0, 1));

            html += `</div>`;

            // ─── FINALS CENTER ───
            html += `<div class="finals-center">`;
            html += `<div class="finals-label">🏁 FINALS</div>`;
            html += `<div class="final-match">`;
            const fTeam1 = data.finalMatch.team1Id ? TEAM_MAP[data.finalMatch.team1Id] : null;
            const fTeam2 = data.finalMatch.team2Id ? TEAM_MAP[data.finalMatch.team2Id] : null;
            const fWinner = data.finalMatch.winnerId ? TEAM_MAP[data.finalMatch.winnerId] : null;

            html += renderTeamOption(fTeam1, data.finalMatch.winnerId === data.finalMatch.team1Id, roundActive.final,
                !fTeam1, 'final', 'team1');
            html += `<div class="match-vs">VS</div>`;
            html += renderTeamOption(fTeam2, data.finalMatch.winnerId === data.finalMatch.team2Id, roundActive.final,
                !fTeam2, 'final', 'team2');

            html += `</div>`;

            // Champion
            const champ = w.champion ? TEAM_MAP[w.champion] : null;
            const champName = champ ? `${champ.name} 🏆` : '?';
            const champClass = champ ? '' : 'empty';
            html += `<div class="champion-box ${champClass}">🏆 Champion<br><strong>${champName}</strong></div>`;

            html += `</div>`;

            // ─── RIGHT SIDE ───
            html += `<div class="bracket-side"><div class="side-label">Right Bracket ➡</div>`;

            // Round of 32 (right half)
            const rightR32 = data.r32matches.filter(m => m.region === 'right');
            html += renderRound('Round of 32', rightR32, 'round32', roundActive.round32, w.round32.slice(8, 16));

            // Round of 16 (right half)
            const rightR16 = data.r16matches.slice(4, 8);
            html += renderRound('Round of 16', rightR16, 'round16', roundActive.round16, w.round16.slice(4, 8));

            // Quarterfinals (right half)
            const rightQ = data.qmatches.slice(2, 4);
            html += renderRound('Quarterfinals', rightQ, 'quarter', roundActive.quarter, w.quarter.slice(2, 4));

            // Semifinal (right)
            const rightS = data.smatches.slice(1, 2);
            html += renderRound('Semifinal', rightS, 'semi', roundActive.semi, w.semi.slice(1, 2));

            html += `</div>`;

            container.innerHTML = html;

            // ─── Attach event listeners ───
            attachTeamListeners();
        }

        // ─── Render a round group ───
        function renderRound(label, matches, roundKey, active, winners) {
            if (!matches.length) return '';
            let html = `<div class="round-group"><div class="round-label">${label}</div>`;
            matches.forEach((m, idx) => {
                const t1 = m.team1Id ? TEAM_MAP[m.team1Id] : null;
                const t2 = m.team2Id ? TEAM_MAP[m.team2Id] : null;
                const wId = m.winnerId || null;
                const disabled = !active || !t1 || !t2;

                html += `<div class="match-card ${disabled ? 'disabled' : ''}" data-round="${roundKey}" data-match="${m.id}">`;

                html += renderTeamOption(t1, wId === m.team1Id, active, !t1, roundKey, `${m.id}_t1`);
                html += `<div class="match-vs">VS</div>`;
                html += renderTeamOption(t2, wId === m.team2Id, active, !t2, roundKey, `${m.id}_t2`);

                html += `</div>`;
            });
            html += `</div>`;
            return html;
        }

        // ─── Render a team option ───
        function renderTeamOption(team, isWinner, active, isEmpty, roundKey, matchKey) {
            if (isEmpty || !team) {
                return `<div class="team-option disabled" style="opacity:0.3;cursor:default;">
                            <span class="seed">—</span>
                            <span class="team-name">TBD</span>
                            <span class="check">❌</span>
                        </div>`;
            }
            const selectedClass = isWinner ? 'winner' : '';
            const clickable = active ? 'cursor:pointer;' : 'cursor:default;';
            return `<div class="team-option ${selectedClass}" 
                        data-round="${roundKey}" 
                        data-team="${team.id}" 
                        data-matchkey="${matchKey}"
                        style="${clickable}">
                        <span class="seed">#${team.seed}</span>
                        <span class="team-name">${team.name}</span>
                        <span class="check">${isWinner ? '✅' : '○'}</span>
                    </div>`;
        }

        // ─── Attach click listeners to team options ───
        function attachTeamListeners() {
            document.querySelectorAll('.team-option:not(.disabled)').forEach(el => {
                el.addEventListener('click', function(e) {
                    const round = this.dataset.round;
                    const teamId = this.dataset.team;
                    const matchKey = this.dataset.matchkey;
                    if (!round || !teamId || state.locked) return;

                    // Find which match this belongs to
                    const matchCard = this.closest('.match-card');
                    if (!matchCard) return;
                    const matchId = matchCard.dataset.match;
                    const roundKey = matchCard.dataset.round;

                    // Determine which slot (team1 or team2)
                    const allOptions = matchCard.querySelectorAll('.team-option:not(.disabled)');
                    let team1El = allOptions[0];
                    let team2El = allOptions[1];
                    if (!team1El || !team2El) return;
                    const team1Id = team1El.dataset.team;
                    const team2Id = team2El.dataset.team;

                    // Make selection
                    selectWinner(roundKey, matchId, teamId, team1Id, team2Id);
                });
            });
        }

        // ================================================================
        //  SELECT WINNER LOGIC
        // ================================================================

        function selectWinner(roundKey, matchId, winnerId, team1Id, team2Id) {
            if (state.locked) return;

            // Validate
            if (winnerId !== team1Id && winnerId !== team2Id) return;
            if (!team1Id || !team2Id) return;

            // Update predictions
            if (roundKey === 'round32') {
                state.predictions.round32[matchId] = winnerId;
            } else if (roundKey === 'round16') {
                state.predictions.round16[matchId] = winnerId;
            } else if (roundKey === 'quarter') {
                state.predictions.quarter[matchId] = winnerId;
            } else if (roundKey === 'semi') {
                state.predictions.semi[matchId] = winnerId;
            } else if (roundKey === 'final') {
                // For final, we store both the final winner and champion
                state.predictions.final = { winner: winnerId };
                state.predictions.champion = winnerId;
                // Auto-advance is done
            }

            state.dirty = true;

            // If we selected a winner and the round is complete, auto-advance
            const data = computeWinners(state);
            const winners = data.winners;

            // Check if current round is fully selected
            let roundComplete = false;
            let nextRound = state.currentRoundIdx;

            if (roundKey === 'round32') {
                const allR32 = data.r32matches;
                const allSelected = allR32.every(m => m.winnerId !== null);
                if (allSelected && state.currentRoundIdx === 0) {
                    roundComplete = true;
                    nextRound = 1;
                }
            } else if (roundKey === 'round16') {
                const allR16 = data.r16matches;
                const allSelected = allR16.every(m => m.winnerId !== null);
                if (allSelected && state.currentRoundIdx === 1) {
                    roundComplete = true;
                    nextRound = 2;
                }
            } else if (roundKey === 'quarter') {
                const allQ = data.qmatches;
                const allSelected = allQ.every(m => m.winnerId !== null);
                if (allSelected && state.currentRoundIdx === 2) {
                    roundComplete = true;
                    nextRound = 3;
                }
            } else if (roundKey === 'semi') {
                const allS = data.smatches;
                const allSelected = allS.every(m => m.winnerId !== null);
                if (allSelected && state.currentRoundIdx === 3) {
                    roundComplete = true;
                    nextRound = 4;
                }
            } else if (roundKey === 'final') {
                if (winnerId && state.currentRoundIdx === 4) {
                    roundComplete = true;
                    nextRound = 5; // done
                }
            }

            if (roundComplete && nextRound > state.currentRoundIdx) {
                state.currentRoundIdx = nextRound;
                // Show toast
                const roundNames = ['Round of 32', 'Round of 16', 'Quarterfinals', 'Semifinals', 'Finals', '🏆 Complete!'];
                showToast(`✅ ${roundNames[state.currentRoundIdx-1]} complete!`, 'success');
            }

            // Re-render
            renderBracket();
            savePredictions();
        }

        // ================================================================
        //  STUDENT DATABASE (demo)
        // ================================================================

        function generateStudentDB() {
            const db = {};
            const classes = [5, 6, 7, 8, 9, 10];
            const sections = ['A', 'B', 'C', 'D', 'E'];
            for (const cls of classes) {
                for (const sec of sections) {
                    for (let roll = 1; roll <= 30; roll++) {
                        const code = `${cls}${sec}${String(roll).padStart(2, '0')}`;
                        db[code] = {
                            code,
                            class: cls,
                            section: sec,
                            roll: String(roll).padStart(2, '0'),
                        };
                    }
                }
            }
            return db;
        }

        const STUDENT_DB = generateStudentDB();

        // ================================================================
        //  API COMMUNICATION (Google Sheets via Apps Script)
        // ================================================================

        async function apiCall(action, payload) {
            if (DEMO_MODE) {
                // Simulate with localStorage
                return demoApiCall(action, payload);
            }

            try {
                const url = API_BASE + '?action=' + action;
                const options = {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                };
                const res = await fetch(url, options);
                const text = await res.text();
                try { return JSON.parse(text); } catch { return { ok: true, raw: text }; }
            } catch (err) {
                console.warn('API call failed, falling back to demo mode', err);
                return demoApiCall(action, payload);
            }
        }

        // ─── Demo mode: localStorage ───
        function demoApiCall(action, payload) {
            const storageKey = 'bracket_predictor_data';
            let data = {};
            try {
                data = JSON.parse(localStorage.getItem(storageKey)) || {};
            } catch { data = {}; }

            if (action === 'verify') {
                const code = payload.code;
                const student = STUDENT_DB[code];
                if (student) {
                    return { ok: true, student };
                } else {
                    return { ok: false, error: 'Student code not found. Please check and try again.' };
                }
            }

            if (action === 'getPredictions') {
                const code = payload.code;
                const record = data[code];
                if (record) {
                    return { ok: true, predictions: record.predictions, name: record.name };
                } else {
                    return { ok: true, predictions: null, name: null };
                }
            }

            if (action === 'save') {
                const { code, name, predictions } = payload;
                const student = STUDENT_DB[code];
                if (!student) return { ok: false, error: 'Invalid student code' };
                data[code] = {
                    name: name || data[code]?.name || 'Unknown',
                    predictions,
                    savedAt: new Date().toISOString(),
                    student,
                };
                localStorage.setItem(storageKey, JSON.stringify(data));
                return { ok: true };
            }

            return { ok: false, error: 'Unknown action' };
        }

        // ================================================================
        //  SAVE / LOAD PREDICTIONS
        // ================================================================

        async function savePredictions() {
            if (!state.student) return;
            const statusEl = document.getElementById('saveStatus');
            statusEl.textContent = '⏳ Saving...';
            statusEl.className = 'save-status saving';

            try {
                const res = await apiCall('save', {
                    code: state.student.code,
                    name: state.student.name,
                    predictions: state.predictions,
                });
                if (res.ok) {
                    statusEl.textContent = '💾 Saved';
                    statusEl.className = 'save-status saved';
                    state.dirty = false;
                } else {
                    statusEl.textContent = '⚠️ Save failed';
                    statusEl.className = 'save-status error';
                }
            } catch (err) {
                statusEl.textContent = '⚠️ Error saving';
                statusEl.className = 'save-status error';
            }
        }

        async function loadPredictions(code) {
            try {
                const res = await apiCall('getPredictions', { code });
                if (res.ok && res.predictions) {
                    state.predictions = res.predictions;
                    if (res.name) {
                        state.student.name = res.name;
                    }
                    // Determine current round from predictions
                    const data = computeWinners(state);
                    const w = data.winners;
                    if (w.champion) state.currentRoundIdx = 5;
                    else if (w.final) state.currentRoundIdx = 4;
                    else if (w.semi.every(s => s !== null)) state.currentRoundIdx = 4;
                    else if (w.semi.some(s => s !== null)) state.currentRoundIdx = 3;
                    else if (w.quarter.every(q => q !== null)) state.currentRoundIdx = 3;
                    else if (w.quarter.some(q => q !== null)) state.currentRoundIdx = 2;
                    else if (w.round16.every(r => r !== null)) state.currentRoundIdx = 2;
                    else if (w.round16.some(r => r !== null)) state.currentRoundIdx = 1;
                    else if (w.round32.every(r => r !== null)) state.currentRoundIdx = 1;
                    else state.currentRoundIdx = 0;

                    return true;
                }
                return false;
            } catch (err) {
                console.warn('Load failed', err);
                return false;
            }
        }

        // ================================================================
        //  AUTO-SAVE (debounced)
        // ================================================================

        let saveTimer = null;

        function autoSave() {
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                if (state.dirty && state.student) {
                    savePredictions();
                }
            }, 2000);
        }

        // Watch for changes
        const origSelect = selectWinner;
        selectWinner = function(...args) {
            origSelect.apply(this, args);
            autoSave();
        };

        // ================================================================
        //  TOAST
        // ================================================================

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `${icon} ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                toast.style.transition = '0.3s ease';
                setTimeout(() => toast.remove(), 350);
            }, 3000);
        }

        // ================================================================
        //  LOGIN / NAME / LOGOUT FLOW
        // ================================================================

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // ─── LOGIN ───
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const codeInput = document.getElementById('studentCode');
            const code = codeInput.value.trim().toUpperCase();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!code) {
                errorEl.textContent = 'Please enter your student code.';
                return;
            }

            // Basic format validation
            const match = code.match(/^(\d{1,2})([A-E])(\d{2})$/);
            if (!match) {
                errorEl.textContent = 'Format: Class + Section + Roll (e.g. 7C25)';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Verifying...';
            errorEl.textContent = '';

            try {
                const res = await apiCall('verify', { code });
                if (res.ok && res.student) {
                    state.student = res.student;
                    state.student.code = code;
                    btn.innerHTML = '<span>✅ Verified!</span>';
                    setTimeout(() => {
                        showScreen('nameScreen');
                        document.getElementById('nameBadge').textContent = `✅ ${code}`;
                        document.getElementById('nameSub').textContent =
                            `Class ${res.student.class} · Section ${res.student.section} · Roll ${res.student.roll}`;
                        document.getElementById('studentName').value = '';
                        document.getElementById('studentName').focus();
                        btn.disabled = false;
                        btn.innerHTML = '<span>Sign In</span>';
                    }, 400);
                } else {
                    errorEl.textContent = res.error || 'Code not found. Please try again.';
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign In</span>';
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In</span>';
            }
        });

        // ─── NAME COLLECTION ───
        document.getElementById('nameForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            if (!name) return;

            const btn = document.getElementById('nameBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Loading...';

            state.student.name = name;

            // Try to load existing predictions
            const loaded = await loadPredictions(state.student.code);

            // If no existing, create fresh
            if (!loaded) {
                state.predictions = {
                    round32: {},
                    round16: {},
                    quarter: {},
                    semi: {},
                    final: {},
                    champion: null,
                };
                state.currentRoundIdx = 0;
            }

            // If champion already picked, set round to final
            if (state.predictions.champion) {
                state.currentRoundIdx = 5;
            }

            // Update display
            document.getElementById('displayName').textContent = `🎓 ${state.student.name}`;
            document.getElementById('displayClass').textContent = `Class ${state.student.class}`;
            document.getElementById('displaySection').textContent = `Sec ${state.student.section}`;
            document.getElementById('displayRoll').textContent = `Roll #${state.student.roll}`;
            document.getElementById('displayCode').textContent = state.student.code;

            showScreen('bracketScreen');
            renderBracket();

            btn.disabled = false;
            btn.innerHTML = '<span>Continue to Bracket →</span>';

            // Auto-save initial
            if (!loaded) {
                await savePredictions();
            }
            showToast(`Welcome, ${state.student.name}! 🎉`, 'success');
        });

        // ─── BACK TO LOGIN ───
        document.getElementById('backToLoginBtn').addEventListener('click', function() {
            showScreen('loginScreen');
            document.getElementById('studentCode').focus();
        });

        // ─── LOGOUT ───
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (state.dirty) {
                savePredictions().then(() => doLogout());
            } else {
                doLogout();
            }
        });

        function doLogout() {
            state.student = null;
            state.predictions = {
                round32: {},
                round16: {},
                quarter: {},
                semi: {},
                final: {},
                champion: null,
            };
            state.currentRoundIdx = 0;
            state.dirty = false;
            document.getElementById('studentCode').value = '';
            document.getElementById('loginError').textContent = '';
            showScreen('loginScreen');
            document.getElementById('studentCode').focus();
            showToast('👋 Logged out successfully.', 'info');
        }

        // ================================================================
        //  INIT
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            // Focus on login input
            document.getElementById('studentCode').focus();

            // Auto-demo hint
            if (DEMO_MODE) {
                console.log('🏆 Running in DEMO mode (localStorage).');
            } else {
                console.log('🏆 Connected to Google Sheets API:', API_BASE);
            }

            // Pre-fill demo code for convenience
            const urlParams = new URLSearchParams(window.location.search);
            const demoCode = urlParams.get('code');
            if (demoCode) {
                document.getElementById('studentCode').value = demoCode.toUpperCase();
            }
        });

        // Keyboard shortcut: Enter on login
        document.getElementById('studentCode').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });

        // ================================================================
        //  EXPOSE FOR DEBUG
        // ================================================================

        window.__state = state;
        window.__render = renderBracket;
        window.__save = savePredictions;
        window.__teams = TEAM_DATA;

        console.log('🏀 Tournament Bracket Predictor loaded.');
        console.log('💡 Use window.__state to inspect state.');
        console.log('📘 Demo codes: 5A01 – 10E30');
    </script>
</body>
</html>
